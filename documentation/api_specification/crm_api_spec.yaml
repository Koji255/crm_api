components:
  schemas:
    AccountGeneral:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactGeneral'
          readOnly: true
        name:
          type: string
          maxLength: 255
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        status:
          $ref: '#/components/schemas/AccountGeneralStatusEnum'
        country:
          $ref: '#/components/schemas/CountryEnum'
        city:
          type: string
          maxLength: 255
        address:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - city
      - contacts
      - created_at
      - id
      - name
      - updated_at
    AccountGeneralStatusEnum:
      enum:
      - new
      - active
      - customer
      - lead
      type: string
      description: |-
        * `new` - New
        * `active` - Active
        * `customer` - Customer
        * `lead` - Lead
    AccountTypeEnum:
      enum:
      - SCHOOL
      - UNIVERSITY
      - COMPANY
      - OTHER
      type: string
      description: |-
        * `SCHOOL` - school
        * `UNIVERSITY` - university
        * `COMPANY` - company
        * `OTHER` - other
    Activation:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
      required:
      - token
      - uid
    ContactGeneral:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          nullable: true
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          nullable: true
          maxLength: 128
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        account:
          type: string
          format: uuid
      required:
      - account
      - created_at
      - email
      - first_name
      - id
      - updated_at
    ContractGeneral:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          $ref: '#/components/schemas/ContractGeneralStatusEnum'
        created_at:
          type: string
          format: date
          readOnly: true
        updated_at:
          type: string
          format: date
          readOnly: true
      required:
      - created_at
      - id
      - updated_at
    ContractGeneralStatusEnum:
      enum:
      - active
      - expired
      type: string
      description: |-
        * `active` - Active
        * `expired` - Expired
    CountryEnum:
      enum:
      - RUSSIA
      - BELARUS
      - KAZAKHSTAN
      - USA
      - EUROPE
      - OTHER
      type: string
      description: |-
        * `RUSSIA` - russia
        * `BELARUS` - belarus
        * `KAZAKHSTAN` - kazakhstan
        * `USA` - usa
        * `EUROPE` - europe
        * `OTHER` - other
    CourseGeneral:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/CourseGeneralStatusEnum'
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        lms_course_ref:
          type: string
          nullable: true
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - unit_price
      - updated_at
    CourseGeneralStatusEnum:
      enum:
      - active
      - archived
      - deleted
      type: string
      description: |-
        * `active` - Active
        * `archived` - Archived
        * `deleted` - Deleted
    CurrencyEnum:
      enum:
      - USD
      - RUB
      type: string
      description: |-
        * `USD` - dollar
        * `RUB` - ruble
    DealClose:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/Status3a3Enum'
        loss_reason:
          type: string
          nullable: true
      required:
      - status
    DealGeneral:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          $ref: '#/components/schemas/Status3a3Enum'
        expected_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        expected_close_date:
          type: string
          format: date
          nullable: true
        description:
          type: string
          nullable: true
        loss_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        account:
          type: string
          format: uuid
        owner:
          type: string
          format: uuid
          nullable: true
        contract:
          type: string
          format: uuid
          nullable: true
        primary_contact:
          type: string
          format: uuid
          nullable: true
      required:
      - account
      - created_at
      - id
      - updated_at
    DealItemInput:
      type: object
