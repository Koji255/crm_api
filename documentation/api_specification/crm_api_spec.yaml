  /api/v1/{user_id}/role/:
    put:
      operationId: v1_role_update
      summary: v1_set_role
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoleInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleInput'
          description: ''
    delete:
      operationId: v1_role_destroy
      summary: v1_revoke_role
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
